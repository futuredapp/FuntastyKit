name: Test

on:
  - pull_request

jobs:
  test:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v6
    - name: Install SwiftLint
      run: |
        brew install swiftlint
    - name: Lint
      run: |
        swiftlint --strict
    - name: Test
      run: |
        xcodebuild -scheme FuntastyKit -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' -sdk iphonesimulator test
